# Whole-body IK config for the Dexmate (Vega) mobile manipulator.
#
# SINGLE SOURCE OF TRUTH for WBCConfig() / VegaWholeBodyIK() / wbc_safety
# Adapted from the reference /home/yixuan/hommi/deps/rby1-wbc/config/wbik.yaml. 
# RBY1 keys intentionally NOT ported: (torso_0/4/5 pinned, torso_3 coupled)

urdf_path: "/home/yixuan/yixuan_utilities/src/yixuan_utilities/assets/robot/vega-urdf/vega_with_robotiq.urdf" #"/home/yixuan/yixuan_utilities/src/yixuan_utilities/assets/robot/vega-urdf/vega_no_effector.urdf"

# every other cost matters as a ratio to these.
ee_position_cost: 10000.0
ee_orientation_cost: 10000.0
lm_damping_ee: 1.0e-5

# --- Base regularization (velocity damping) -----------------------------------------------
# Vega's planar root fixes z/roll/pitch *structurally*, so those ground/upright
# pins are no-ops here and carry 0. x/y/yaw are heavily damped so stationary and
# hand-only VR target changes stay in the arms/torso, while large head/body motion
# can still wake the chassis through the WBC base twist.
base_position_cost: [10000.0, 10000.0, 0.0]  # x/y: hand-only shifts prefer arms; z: no-op
base_orientation_cost: [0.0, 0.0, 10000.0]   # roll/pitch: no-ops; yaw stiff like x/y
# LM damping on the base task. RBY1 hardcodes 1e-6 in code; same value.
lm_damping_base: 1.0e-6

# --- Base velocity smoothing (anti-jitter) -------------------------------------------------
# Per-axis (vx, vy, wz) penalty on the CHANGE in base twist between consecutive 100 Hz
# solves -- a base-ACCELERATION term, NOT damping. base_position_cost above damps the base
# toward zero velocity (resists ALL base motion, a wanted straight drive included); this
# leaves any steady twist unpenalized and resists only frame-to-frame reversals/jumps. It
# exists because teleop EE targets carry inevitable leader-side noise that the redundant QP
# would otherwise resolve into a laterally whipping base. Lower than base_position_cost.
base_velocity_smoothing_cost: [0.0, 0.0, 4000.0] # wz on: penalize frame-to-frame base-yaw reversals (head-yaw-driven wheel jitter); steady turns unpenalized

# --- Posture regularization toward the nominal posture ------------------------------------
# Per-group PostureTask cost: resolves redundancy by pulling joints toward
# nominal_posture (below) when the EE targets leave slack. Vega intentionally weights
# torso far above arms so small reachable hand changes use arm redundancy without
# leaning the upper body. Head remains 0 because it is externally commanded and
# QP-pinned, so a pull would only fight the pin.
posture_cost_torso: 200   # keep torso quiet for local EE changes without blocking large reaches
posture_cost_arm: 10       # let arms absorb local EE changes
posture_cost_head: 0.0     # follows RBY1 nominal_posture_cost_head: 0 (head not an IK DOF)

# --- Joint-space velocity damping ----------------------------------------------------------
# Second PostureTask, re-targeted to the *current* configuration each solve (zero
# error => pure per-joint velocity damping on the actuated joints). This is kept low
# so arm joints can respond promptly to small hand target changes; torso quieting is
# handled by the higher nominal torso posture cost plus the CoM/torso-top terms.
current_posture_cost_main: 10   # torso + arms velocity damping
current_posture_cost_head: 0.0   # follows RBY1 current_posture_cost_head: 0

# --- Head: dedicated teleop IK, NOT a whole-body task ----------------------------------------
# The head follows omniteleop's vr_reader head-teleop semantics (the follower's
# head_mode 'track' path), but the IK is solved follower-side by
# VegaWholeBodyIK.solve_head against the LIVE whole-body configuration -- so base yaw
# and torso lean are compensated, unlike vr_reader's leader-side KinHelper version
# (frozen nominal body). solve_head is a damped least-squares step on head_j2/j3 only
# (head_j1 rides, like vr_reader's qmask), tracking the camera VIEWING DIRECTION only
# (a 2-DOF error for 2 DOFs; full-3D-orientation LS can wedge the viewing axis 10+
# deg off-target at a stationary point, and a pan/tilt head cannot do roll/position
# anyway), toward the calibrated headset pose the leader publishes
# (VRJointData.head_ee_pose). Its joint command is
# fed back through solve(head_joints=...), which writes it into the model (so
# collisions / CoM / FK track the commanded head) while QP equality rows pin the head
# DOFs out of the whole-body QP.
# Exponential convergence rate (1/s) toward the headset target. 100 makes
# min(1, gain*dt) = 1 at the 100 Hz loop: one full damped-LS step per tick -- a
# stiff tracker, the same role the QP plays for the EE targets. Smoothing of the
# 10 Hz operator commands is the follower's job (wbc_vr_record lerp/slerps
# head_ee_pose through the same TargetInterpolator as the EE targets), so the
# body-motion compensation (base yaw / torso lean) is NOT low-passed: a tau=0.14s
# filter here turned fast base yaw into ~4-7 deg transient view swings. Set 7.0 to
# restore vr_reader's heavy exponential smoothing instead (its KinHelper call at
# damp=100 advances ~39% per 15 Hz frame ~= rate 7.4/s, tau ~= 0.14 s) if stiff
# tracking ever feels twitchy on real video.
head_ik_gain: 100.0
# Damped-LS regularization of the solve_head step. Pure conditioning (smoothing comes
# from head_ik_gain): bounds the 2-DOF step when the pan/tilt axes degenerate against
# the orientation error near the joint-range extremes.
head_ik_damp: 1.0e-2

# --- Head whole-body IK mode (rby1 `ik` port) ------------------------------------------------
# ALTERNATIVE to the solve_head "track" path above. "track": head is externally
# commanded (solve(head_joints=...)) and pinned out of the QP. "ik" (current
# default): the head DOFs become whole-body QP variables and a head FrameTask tracks
# the headset pose (solve(head_target=...)), so base + torso + head co-track it --
# the base follows head turn/translation and is anchored when the head is still
# (the rby1 head_pos_cost/head_ori_cost mechanism). NOTE: distinct from
# vr_robot_controller's unrelated head_mode (track/fixed).
head_mode: "ik"
# Head FrameTask weights for head_mode "ik" (ignored in "track"). Follow RBY1
# head_pos_cost / head_ori_cost (10000). Roll about the camera forward axis is
# unactuatable (planar-yaw base + pitch torso + pan/tilt head); the QP just leaves it
# as residual (RBY1 keeps roll weighted too) -- zero the roll axis only if it biases.
head_position_cost: 0.0
head_orientation_cost: [10000.0, 10000.0, 10000.0]
# WORLD-frame head-position objective (head_mode "ik" only), the gravity-aligned
# alternative to head_position_cost. A pink FrameTask weights position in the head's
# own LOCAL axes, but zed_depth_frame is pitched ~45 deg down, so a [x,y,0] mask there
# would free the optical axis, NOT world-vertical (and would corrupt fore/aft anchoring).
# This is a SOFT least-squares term added directly to the QP (like com_over_base) on the
# head's WORLD-aligned translation, so [x, y, z] are true gravity axes: track world x/y
# (preserves base-following) and free world-z so the torso can straighten to a high EE
# target without the head-z term fighting it (the operator's standing height is fixed, so
# head-z carries no teleop intent). [0, 0, 0] disables it (use head_position_cost instead).
# To switch a run to the gravity-aligned scheme set head_position_cost: 0.0 here and
# head_world_position_cost: [10000.0, 10000.0, 0.0] (optionally a small z like 200 as a
# camera-height comfort prior, NOT an EE-peer 10000).
head_world_position_cost: [10000.0, 10000.0, 0.0]

# --- Torso-top x anchor (hard QP equality) ----------------------------------------------------
# RBY1's hard torso equality rows (torso_3 == -(torso_1 + torso_2) keeps its arm/head mount from pitching
# fore-aft). Vega analog: a QP equality row holds "arm_center" -- the fixed mount at the
# top of torso_l3 (torso_j3 is the link's lower joint; head_j1 attaches right next to
# it) that carries both arms and the head chain -- at the SAME base-frame x it has at
# the nominal_posture below. EE load can then never lean the upper body fore-aft over
# the base: the base drives instead. ONLY that x is anchored: the mount's height, the
# lower torso joints (torso_j3 included), and torso_l3's pitch all stay free.
enable_torso_top_x_anchor: true
# Correction rate (1/s) of the equality's right-hand side: each tick servos
# min(1, gain*dt) of the residual offset from the anchor (the head_ik_gain
# convention), so off-anchor states (measured current_q, custom reset poses) recover
# instead of holding their lean. The per-tick correction is clipped to half the
# velocity-limit headroom of the row so the equality can never by itself make the QP
# infeasible. 100 => full correction per 100 Hz tick.
torso_top_x_anchor_gain: 100.0


base_xy_max_vel: 1.0
base_yaw_max_vel: 1.0
velocity_limit_scale: 0.9

# --- Single-axis base motion (one pure chassis motion per tick) ----------------------------
# The QP resolves leader/EE-target noise into small simultaneous vx/vy/wz, so a "drive
# straight" leans sideways, an in-place turn wanders, and a meant-to-be-still base creeps.
# When enabled, solve() keeps only the single dominant base axis (vx XOR vy XOR wz) and
# zeroes the other two -- and zeroes all three when the base is quiet -- so each chassis
# command is a pure forward, strafe, or yaw motion. (Distinct from the vr_teleop: deadbands,
# which shape the already-chosen command follower-side.)
enable_base_single_axis: true
# Quiet floor on the dominant axis, as a fraction of the base velocity cap: |vx|,|vy| /
# base_xy_max_vel and |wz| / base_yaw_max_vel compare on this common scale; below it the base
# is held still (all three zeroed). The solver's "is the base meant to move at all" gate.
base_single_axis_deadband: 0.04
# Relative hysteresis on the axis choice: retain the previously active axis unless a
# different axis beats it by this fraction, so two near-equal axes don't chatter the chassis
# between (say) forward and turn at 100 Hz. 0 disables (pure per-tick argmax).
base_single_axis_hysteresis_ratio: 0.2

solver: "daqp"
damping: 1.0e-6

# --- Safety: self-collision avoidance ------------------------------------------------------
# Two layers reproduce RBY1's two-distance mink CollisionAvoidanceLimit
# (safety_distance 0.01 hard / influence_distance 0.02 soft) on the pink backend:
# a proactive SelfCollisionBarrier CBF in the QP (safe_dist) plus the reactive
# SafetyGate hold as the hard backstop (floor).
enable_collision_avoidance: true
collision_spheres_urdf: "/home/yixuan/miniforge3/envs/dexmate/lib/python3.12/site-packages/dexmate_urdf/robots/humanoid/vega_1/vega_1_collision_spheres.collision.urdf"
# CBF separation target (m): the barrier asymptotically forbids cross-group sphere
# pairs closer than this. 
self_collision_safe_dist: 0.02 # will give ~0.04m in real robot, should be enough
# Reactive hard floor (m): a step below this distance that is also *worsening* is
# held (joints freeze; the base may keep moving).
self_collision_floor: 0.01
# Build-time SRDF-style filter: drop cross-group sphere pairs closer than this at the
# nominal posture (the by-design shoulder-in-torso overlaps), so the barrier starts
# feasible. No RBY1 counterpart -- its hand-curated geom groups never form such pairs.
nominal_pair_keep_dist: 0.04 # run scripts/diagnostics/browse_collision_pairs_sapien.py to visualize
# pink-only: the barrier constrains the N closest pairs per solve (QP rows). No RBY1
# counterpart -- mink constrains every pair within its detection distance. 120 is the
# smallest value with zero candidate floor breaches across clap/cross/torso scenarios
# at the 100 Hz IK rate AND at a 5x-degraded 20 Hz rate (loop-overrun stress); 40/80
# let fast-approaching pairs outside the N closest crash through at degraded rates
# (scripts/diagnostics/probe_collision_rule_compare.py). Solve cost ~6.4 ms of the 10 ms tick.
n_collision_pairs: 120
# CBF gain (h_dot >= -gain*h): shapes how fast pairs may approach safe_dist.
# pink-only; RBY1's mink velocity damper has no gain knob.
collision_barrier_gain: 1.0
# 0 drops pink's "safe backup velocity" objective term (it otherwise biases the
# redundancy resolution and stalls the base mid-maneuver. Mink has no such term.
collision_safe_displacement_gain: 0.0

# --- Safety: tip-over (CoM-over-base: hard QP inequality + soft centering) -----------------
# Ports RBY1's _add_com_over_base_xy_inequalities: the QP bounds the centroid proxy's
# horizontal over-base offset within +/-com_safety_margin of its value at the config
# nominal posture, so the robot keeps moving while staying upright (no reactive stop).
enable_com_safety: true  # Vega-only switch (RBY1: active when com_over_base_xy_bounds is set)
# Soft CoM-over-base centering weight, ported from RBY1's com_over_base_pos_cost
# [100000, 100000, 0] (10x the EE cost): a high-priority *objective* term that
# continuously pulls the proxy's horizontal over-base offset back to nominal, with
# the hard box below as the safety backstop. Added directly to the QP objective on
# the same base-frame xy offset/Jacobian as the hard box -- NOT as a pink
# RelativeFrameTask, whose [c, c, 0] mask lives in the target's local frame: Vega's
# torso_l3 is pitched 7.5 deg at nominal (no RBY1-style torso linkage to keep it
# upright), so the mask would leak ~13% of *vertical* proxy motion into the 1e5
# term. 0 disables the term (requires enable_com_safety).
com_over_base_pos_cost: 100000.0
# Centroid proxy whose over-base offset is bounded: the top torso link frame origin,
# like RBY1's hardcoded "link_torso_5" lean proxy. "com" swaps in the true whole-body
# centre of mass (Vega extension).
com_centroid: "torso_l3"
# Box half-width (m), applied to both axes. Follows RBY1 com_over_base_xy_bounds:
# [0.08, 0.08]. Also reused by the (Mink-backend) reactive gate as its minimum
# CoM-inside-support-polygon margin.
com_safety_margin: 0.08

# joints not listed default to 0.
# The tip-over box above is anchored at this posture.
#
# Torso + arms reproduce the operational pose of dexcontrol's
# `examples/advanced_examples/fold_robot.py --unfold` so the WBC's redundancy
# resolution rests at the same configuration the robot powers up into.
nominal_posture:
  torso_j1: 0.78 # 0.5235987755982988    # pi/6
  torso_j2: 1.5707963267948966 # 1.0471975511965976    # pi/3
  torso_j3: 0.0 # 0.39269908169872414   # pi/8
  L_arm_j1: 0.844    # L_shape 0.064 + torso pitch 0.78
  L_arm_j2: 0.3      # L_shape
  L_arm_j4: -1.556   # L_shape
  L_arm_j5: 1.271    # L_shape
  R_arm_j1: -0.844   # L_shape -0.064 - torso pitch 0.78
  R_arm_j2: -0.3     # L_shape
  R_arm_j4: -1.556   # L_shape
  R_arm_j5: -1.271   # L_shape

# --- VR teleop follower control loop (NOT a WBCConfig field) ----------------------------------
# Shared command-stream shaping for BOTH whole-body VR followers -- the SAPIEN sim
# follower (scripts/wbc_vr_record.py) and the real-robot follower
# (scripts/wbc_vr_robot.py). Loaded by omniteleop.wbc_teleop.VRTeleopConfig and bound to
# both followers' argparse defaults, so a take recorded/visualized in sim replays the SAME
# way on hardware (the head/base shaping must match). Kept HERE, beside the WBC solver
# tunables, so there is one follower config file. WBCConfig.from_yaml deliberately IGNORES
# this block -- these are control-loop parameters, not solver parameters (see
# _NON_WBC_SECTIONS in whole_body_ik.py). The hardware/replay bring-up knobs (homing,
# joint-step clamp, base max speed, the sim follower's OPEN-loop base deadband, ...) stay
# local to each script.
vr_teleop:
  # Replay speed multiplier (<1 = slower). The staged bring-up replays sim takes slowly.
  replay_speed: 1.0
  # Control-loop rates (Hz), shared by BOTH followers. ik_rate: the whole-body IK / control loop rate.
  # cmd_rate: the leader command rate the low-rate stream is lerp/slerp-interpolated up
  # from, toward ik_rate; it MUST match wbc_vr_leader.py --rate. 0 disables interpolation
  # (zero-order hold). Replay rejects recorded command gaps above 5x this nominal glide.
  ik_rate: 100.0
  cmd_rate: 10.0
  # Head-target first-order low-pass time constant (s) before IK; suppresses headset dither
  # that would otherwise resolve into base yaw in head_mode "ik". 0 disables.
  head_lpf_tau: 0.35
  # Planar head-target deadband: radial x/y (m) and heading-yaw (rad) held at the nominal
  # anchor so small headset drift does not wake the base, while larger motion passes through
  # (direction-preserving).
  head_planar_pos_deadband: 0.04
  head_planar_yaw_deadband: 0.30 # 0.12/0.20
  # Closed-loop base PD gains on the (solver base pose - measured base pose) error -- the
  # real-robot values, shared with scripts/drive_box_record.py's base controller.
  base_kp_xy: 1.0
  base_kp_yaw: 1.5
  # Closed-loop base-twist pre-deadband (m/s; angular = 2x): the quiet band fed into
  # base_closed_loop.shape_twist. Shared by BOTH followers' closed loop -- the sim
  # follower's separate OPEN-loop deadband stays script-local.
  base_deadband: 0.02
  # Base-twist slew limit (m/s^2; angular = 2x), applied by base_closed_loop.shape_twist.
  base_accel: 0.4
  # Base linear-velocity clamp (m/s; angular = 2x) on the commanded base twist, applied
  # inside base_closed_loop.pd_twist/shape_twist by BOTH followers. Conservative for a first
  # bring-up; the sim follower clamps to the SAME value so a take replays at the same base
  # speed on hardware. (The WBC solver's own caps are base_xy_max_vel/base_yaw_max_vel above.)
  base_max_speed: 0.45
  # Per-axis base-twist post-deadband (linear m/s, angular rad/s) applied AFTER
  # deadband/clamp/slew, using the pre-slew raw command as the activity reference. Its job
  # is now only the post-slew tail-cut at start/stop/axis-switch (clean stops): cross-axis
  # leakage is owned upstream by the WBC single-axis projection (enable_base_single_axis), so
  # the linear band no longer needs the large 0.18 that chopped slow single-axis drives (it
  # zeroed legit forward/strafe commands on 35-150 ticks/take); back to the nominal quiet band.
  base_post_linear_deadband: 0.02
  base_post_angular_deadband: 0.12
